<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe - Ultimate Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-wrapper">
        <header>
            <h1>Tic-Tac-Toe</h1>
            <div class="player-status">
                <div class="player p1 active" id="p1-card">Player X</div>
                <div class="player p2" id="p2-card">Player O</div>
            </div>
        </header>

        <main>
            <div class="game-board" id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
        </main>

        <footer>
            <button id="reset-btn">Reset Grid</button>
        </footer>

        <!-- Winner Modal -->
        <div id="modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="winner-msg">Player X Wins!</h2>
                <button id="play-again-btn">Challenge Again</button>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
