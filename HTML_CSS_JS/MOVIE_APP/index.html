<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Search App | By Praveen kumar</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <header>
    <h1>🎬 Movie Search Engine</h1>
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Search for TV shows or movies...">
      <button id="searchBtn">Search</button>
    </div>
  </header>

  <main>
    <!-- Movies yahan grid format mein render hongi -->
    <section id="movieList">
      <p style="text-align: center; grid-column: 1 / -1;">Search something to see results here!</p>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
