<!DOCTYPE html>
<html lang="en">

<head>
    <title> Add to Cart</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <header>
        <h1> Mere Store main aapka most welcome jeee..... </h1>
        <h2> Praveen kumar jayswal</h2>
        <div id="cart-summary">
            Cart: <span id="cart-count">0</span> items
        </div>
    </header>

    <main>
        <section id="products-section">
            <h2>Products</h2>
            <div id="products-container" class="product-grid">

                <p>Loading products brother...</p>
            </div>
        </section>

        <aside id="cart-section">
            <h2>Cart</h2>
            <div id="cart-items">

                <p>aapka cart abhi khali h.</p>
            </div>
            <div id="cart-total">
                <strong>Total: ₹<span id="total-price">0.00</span></strong>
            </div>
            <button id="checkout-btn" disabled>Paisa bhara bhaiya</button>
        </aside>
    </main>

    <script src="index.js"></script>
</body>

</html>
