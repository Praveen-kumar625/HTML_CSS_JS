<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>
</head>
<body>
     
     <!--SIGNUP PAGE (LOCAL STORAGE) using html css js-->
     <fieldset>
        <legend>Signup</legend>     
     <form action="" id="formData">

        <label for="name">Name</label>
        <input type="text" id="name">
        <br>
        <label for="email">Email</label>
        <input type="email" id="email">
        <br>
        <label for="password">Password</label>
        <input type="password" id="password">
        <br>
        <button type="submit">Signup</button>
     </form>
     </fieldset> <fieldset>
         <legend>Login</legend>
         <form action="">
            <label for="email">Email</label>
            <input type="email" id="email">
            <br>
            <label for="password">Password</label>
            <input type="password" id="password">
            <br>
            <button type="submit">Login</button>
         </form>    
     </fieldset>       
     <script>
        let form = document.querySelector("#formData");
        form.addEventListener("submit",(e)=>{
            e.preventDefault();
            console.log("submitted");
            let userData={  
               name:form[0].value,
               email:form[1].value,
               password:form[2].value,
            }
            localStorage.setItem("userData",JSON.stringify(userData));
            alert("signup successful");
            form.reset();
            let loginform = document.querySelector("#loginForm");
            loginform.addEventListener("submit",(e)=>{
                e.preventDefault();
                console.log("submitted");
                let loginData={  
                   email:loginform[0].value,
                   password:loginform[1].value,
                }
               if(loginData.email===userData.email && loginData.password===userData.password){
                alert("login successful");
                loginform.reset();
                window.location.href="welcome.html  ";
               }    
               else{
                alert("galti se mistake ho gayi re baba....");
               }
            }   )
      
     </script>
     <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: #f5f5f5;
        }
        fieldset{
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        legend{
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        form{
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        input{
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button{
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }   
     </style>
</body>
</html>
