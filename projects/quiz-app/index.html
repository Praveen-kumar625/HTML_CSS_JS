<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz App | By Praveen kumar</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- Semantic HTML tags ka use -->
  <main class="quiz-container">
    <header>
      <h1>🧠 Quiz Time!</h1>
    </header>

    <section id="quizScreen">
      <div class="top-bar">
        <span>Score: <span id="score">0</span></span>
        <span class="timer">⏱ <span id="timer">15</span>s</span>
      </div>

      <p class="question-num" id="questionNum">Question 1 of 5</p>
      <h2 class="question" id="question"></h2>

      <div class="options" id="options">
        <!-- Options JS se dynamically inject honge -->
      </div>

      <button id="nextBtn" disabled>Next Question</button>
    </section>

    <!-- Result screen jo end me dikhayi jayegi -->
    <section id="resultScreen" class="result hide">
      <h2>🎉 Quiz Complete!</h2>
      <div class="final-score" id="finalScore">0 / 5</div>
      <p id="resultMsg"></p>
      <button id="restartBtn">Play Again</button>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
